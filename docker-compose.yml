version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ai_health_diet_db
    environment:
      POSTGRES_USER: diet_user
      POSTGRES_PASSWORD: diet_password
      POSTGRES_DB: ai_health_diet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_health_diet_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://diet_user:diet_password@db:5432/ai_health_diet_db
      - SECRET_KEY=supersecretjwtkey_change_in_production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    depends_on:
      - db
    volumes:
      - ./backend:/app

volumes:
  postgres_data: